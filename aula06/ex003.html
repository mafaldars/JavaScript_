<!DOCTYPE html>
<html lang="en-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulação de Dados</title>
    <style>
        body {
            background-color: rgb(187, 123, 3);
            color: white; 
            font: 10pt Arial;
        }
    </style>
</head>
<body>
    <!-- comentários -->
    <h1>Hello, World!</h1>
    <h2>Manipulação de Dados</h2>

    <script>
        // comentário de uma linha
        /* comentário
        de várias linhas */

        var n1 = Number(window.prompt ('Escreva um número: '))
        var n2 = Number(window.prompt ('Escreva outro número: '))
        var soma = n1 + n2
        window.alert (`A soma entre ${n1} e ${n2} é igual a ${soma}`) // concatenação
        // number + number para adição
        // string + string para concatenação
    </script>
   
</body>
</html>
