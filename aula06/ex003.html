<!DOCTYPE html>
<html lang="en-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulação de Dados</title>
    <style>
        body {
            background-color: rgb(187, 123, 3);
            color: white; 
            font: 10pt Arial;
        }
    </style>
</head>
<body>
    <!-- comentários -->
    <h1>Hello, World!</h1>
    <h2>Manipulação de Dados</h2>

    <script>
        // comentário de uma linha
        /* comentário
        de várias linhas */

        var n1 = Number.parseInt(window.prompt ('Escreva um número: ')) // prompt retorna como String - característica do comando
        var n2 = Number.parseInt(window.prompt ('Escreva outro número: ')) // prompt retorna como String - característica do comando
        var n3 = Number.parseFloat(window.prompt ('Escreva outro número: '))
        var n4 = Number.parseFloat(window.prompt('Escreva outro número: '))
        var n5 = Number(window.prompt('Escreva o último número: ')) // Number faz a conversão sozinho - inteiro ou real - 5.5 por ex
        var soma = n1 + n2 + n3 + n4 + n5
        window.alert (`A soma entre ${n1}, ${n2}, ${n3}, ${n4} e ${n5} é igual a ${soma}`) // concatenação
        // (number + number) para adição
        // (string + string) para concatenação
        /*
        Conversão de String para Number:
        Number.parseInt(n) - conversão de um número para um número inteiro
        Number.parseFloat(n) - Floating Point - conversão para números decimais 
        */
    </script>
   
</body>
</html>
