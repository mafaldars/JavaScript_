<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Length</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>

    <script>
        var nome = window.prompt('Qual é o seu nome?')
        var morada = window.prompt('A sua morada é: ')
        var idade = window.prompt('Qual é a sua idade? ')
        document.write(`Olá ${nome}, o seu nome tem ${nome.length} letras.`)
        document.write(` O seu nome em maiúsculas é ${nome.toUpperCase()}.`)
        document.write(` O seu nome em minúsculas é ${nome.toLowerCase()}.`)
        document.write(` Olá ${nome}, a sua morada é ${morada.toUpperCase()}.`)
        document.write(` ${nome}, a sua idade é ${idade} e a sua morada é ${morada}.`)
    </script>

</body>
</html>
