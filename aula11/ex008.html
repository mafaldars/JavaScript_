<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condições</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        .texto {
            color: red;
            white-space: pre-line;
                
        }
        .quebra {
            color: red;
            white-space: pre-line;
        }
    
    </style>
</head>
<body>

    <STRONG>TIPOS DE CONDIÇÃO</STRONG>

    <p class="texto">

        if (condição) {
            true
        } else {
            false
        }
    </p>


    <div class="quebra">
        Condição simples:
        
        if (condição) {
            true
        }
    </div>
    
    
</body>
</html>
