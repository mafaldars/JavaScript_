<!DOCTYPE html>
<html lang="en-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETRAN</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>

    <h1>Sistema de Multas</h1>

    Velocidade do carro:<input type="number" name="txtvel" id="txtvel"> Km/h.
    
    <input type="button" value="verificar" onclick="calcular()">

    <div id="res">
        Resultado
    </div>

    <script>
        

        function calcular() {
            var txtv = window.document.querySelector('input#txtvel')
            var res = window.document.querySelector('div#res')
            var vel = Number(txtv.value)
            res.innerHTML = (`<p>A sua velocidade é de ${vel} Km/h.</p>`)
            if (vel > 60) {
                res.innerHTML += (`Foi multado por exceder o limite de velocidade`)
            } else {
                vel < 60
                res.innerHTML += (`Parabéns! Cumpriu os limites de velocidade.`)
            }
            res.innerHTML += (`<p> Conduza sempre com precaução e use o cinto de segurança! </p>`)


        }

    </script>
    
</body>
</html>
